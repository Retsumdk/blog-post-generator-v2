name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: CLI smoke test (determinism)
        run: |
          python -m blog_post_generator_v2 examples/outline.json --notes examples/notes.md --date 2026-10-23 --out /tmp/run1.md --audit /tmp/audit1.md
          python -m blog_post_generator_v2 examples/outline.json --notes examples/notes.md --date 2026-10-23 --out /tmp/run2.md
          diff /tmp/run1.md /tmp/run2.md
          grep -q "^---$" /tmp/run1.md
          grep -q "SEO audit" /tmp/audit1.md
      - name: Package install check
        run: |
          pip install .
          bpgen --help > /dev/null
